<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demand Planning Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a7f37'/%3E%3Cpath d='M7 23V15M13 23V10M19 23v-6M25 23V7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="kit.css">
  <style>
    :root { --accent: #1a7f37; --accent-text: #1a7f37; --accent-wash: rgba(26, 127, 55, 0.1); }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) { --accent-text: #6fcf8a; --accent-wash: rgba(111, 207, 138, 0.14); }
    }
    :root[data-theme="dark"] { --accent-text: #6fcf8a; --accent-wash: rgba(111, 207, 138, 0.14); }
    .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 16px; }
    .controls .group { display: flex; gap: 8px; align-items: center; min-width: 0; }
    .controls .group > span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .heat td.cell { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; padding: 7px 10px; }
    .heat th.rot { font-size: 11.5px; white-space: nowrap; }
    .scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .scale i { display: inline-block; width: 120px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, #cde2fb, #6da7ec, #2a78d6, #184f95, #0d366b); }
    .sku-chip { display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; background: var(--surface-2); }
    .sku-chip b { font-weight: 600; }
    .progress-wrap { max-width: 560px; margin: 80px auto; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/forecast"><span class="brand-mark" aria-hidden="true">DP</span><span class="brand-name">Demand Planning Studio</span><span class="brand-sub">retailml</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="topbar-right">
        <span class="env-pill" id="env">starting</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
      </div>
    </div>
  </header>
  <main class="page" id="app"></main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
