[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailml"
version = "0.1.0"
description = "Retail demand forecasting and recommendation with backtesting, drift detection and gated retraining"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["forecasting", "recommender", "mlops", "drift-detection", "backtesting", "retail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "numpy>=1.24"]
spark = ["pyspark>=3.5"]
mlflow = ["mlflow>=2.10"]
airflow = ["apache-airflow>=2.8"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
dev = [
    "pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "scikit-learn>=1.3", "numpy>=1.24",
    "fastapi>=0.110", "httpx>=0.27",
]

[project.scripts]
retailml = "retailml.cli:main"

[project.urls]
Homepage = "https://github.com/Akarshanagoud/retail-forecasting-recommender"
Issues = "https://github.com/Akarshanagoud/retail-forecasting-recommender/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retailml = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["retailml"]
branch = true
