name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests airflow
      - name: Test
        run: pytest --cov=retailml --cov-report=term-missing

  ml-quality-gates:
    # The claims the README makes, enforced. A model that stops beating its
    # baseline, or a feature pipeline that starts leaking, fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .

      - name: No feature may depend on a future target
        run: retailml leakage-check --series 8

      - name: The feature model must beat seasonal naive
        run: |
          set -e
          retailml backtest --skus 6 --stores 2 --days 730 \
            --models seasonal_naive,holt_winters,ridge,ensemble \
            --origins 5 --json > backtest.json
          python .github/scripts/check_backtest.py backtest.json

      - name: The recommender must beat recommending bestsellers to everyone
        run: retailml evaluate-reco --skus 20 --customers 800 --min-ndcg-lift 0.05

      - name: Drift detection must fire on injected decay
        run: |
          set -e
          if retailml drift --baseline-error 0.20 --recent-error 0.60 --fail-on-drift; then
            echo "expected drift detection to fail the run"
            exit 1
          fi

  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: DAG graph is acyclic and fully wired
        run: python .github/scripts/check_dag.py
